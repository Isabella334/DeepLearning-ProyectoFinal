# Cada nombre de config.yaml necesita su entrada.
#   tamano:   medidas MEDIAS en metros (box: [x, y, z], cylinder: [radio, medio_largo], sphere: [radio])
#   aspecto:  embedding simulado que recibe el robot (coseno < 0.85 entre tipos distintos)
#   friccion: [deslizar, torsion, rodar]
#   Opcionales: empujable (true), al_inicio (true), copias (1)

lapicero rojo:
  forma: cylinder
  tamano: [0.005, 0.06]
  masa: 0.012
  rgba: [0.85, 0.1, 0.1, 1]
  aspecto: [1.0, 0.1, 0.1, 0.2]
  friccion: [0.6, 0.02, 0.02]

lapicero azul:
  forma: cylinder
  tamano: [0.005, 0.06]
  masa: 0.012
  rgba: [0.1, 0.2, 0.85, 1]
  aspecto: [0.1, 0.1, 1.0, 0.2]
  friccion: [0.6, 0.02, 0.02]

borrador:
  forma: box
  tamano: [0.025, 0.012, 0.008]
  masa: 0.02
  rgba: [0.95, 0.95, 0.95, 1]
  aspecto: [0.9, 0.9, 0.9, 0.1]

bolita de papel:
  forma: sphere
  tamano: [0.015]
  masa: 0.004
  rgba: [0.9, 0.9, 0.8, 1]
  aspecto: [0.2, 0.3, 0.2, 1.0]
  friccion: [0.6, 0.02, 0.02]
  copias: 2

virutas de lapiz:
  forma: box
  tamano: [0.015, 0.015, 0.003]
  masa: 0.003
  rgba: [0.75, 0.55, 0.3, 1]
  aspecto: [0.5, -0.6, -0.4, 0.5]

cuaderno verde:
  forma: box
  tamano: [0.07, 0.1, 0.005]
  masa: 0.4
  rgba: [0.15, 0.6, 0.25, 1]
  aspecto: [0.1, 1.0, 0.2, 0.3]
  empujable: false
  al_inicio: false
